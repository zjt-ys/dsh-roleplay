# dsh-roleplay bundle patch.
#
# 插入三行：
#
#   1. dsh-roleplay        —— 宿主半：按会话存人设/记忆/提示词，注入 system prompt，
#                             暴露 /api/roleplay 路由与 roleplay_memory 工具。
#   2. preset-roleplay     —— 「角色扮演」agent preset：新建对话时选它，才会出现
#                             角色扮演提示词注入与侧边栏记忆联动。
#   3. roleplay-panel-locale —— 浏览器半的 dsh.client 由 package.json 声明自动发现，
#                             这里不需要行；浏览器半只依赖宿主半的 HTTP 路由。
#
# preset 的内容是「标准预设 + 角色扮演」。之所以照抄 standard 的完整子插件表，
# 是因为 preset 的 config 是**整段替换**：漏掉哪一行，那个工具就在角色扮演会话
# 里消失。人格由本插件在 agent.ctx 上注入，因此这里用最小 persona 占位。
- insert:
    - id: dsh-roleplay
      name: dsh-roleplay

    - id: preset-roleplay
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: roleplay
        name: 角色扮演
        description: 以虚构角色的身份对话；人设 / 长期记忆 / 提示词按会话独立管理，可在侧边栏「角色扮演」面板编辑。
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              complete: false
              includeRuntimeContext: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
