  <path d="M24 9v28.4" stroke="url(#rp-cover)" stroke-width="1.8" opacity="0.75"/>
  <!-- a small mask marking the character on the left page -->
  <path d="M13 18.5c2.6-1.1 5.4-1.1 7 0 0 4.2-1.6 6.8-3.5 6.8S13 22.7 13 18.5Z"
        fill="url(#rp-cover)" opacity="0.85"/>
  <circle cx="15.8" cy="20.6" r="0.9" fill="#fff" opacity="0.9"/>
  <circle cx="17.9" cy="20.6" r="0.9" fill="#fff" opacity="0.9"/>
  <!-- text lines on the right page -->
  <path d="M28.5 17.5h7M28.5 21.5h7M28.5 25.5h4.5" stroke="url(#rp-cover)" stroke-width="1.6"
        stroke-linecap="round" opacity="0.7"/>
</svg>
