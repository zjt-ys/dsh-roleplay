<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Roleplay">
  <defs>
    <linearGradient id="rp-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#3aa0ff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="11" fill="url(#rp-cover)" opacity="0.16"/>
  <rect x="1" y="1" width="46" height="46" rx="11" fill="none" stroke="url(#rp-cover)" stroke-width="2"/>
  <!-- an open mask/book: two pages meeting at the spine -->
  <path d="M24 9c-3.6-2.4-8.4-3.4-13-3.2v28.4c4.6-.2 9.4.8 13 3.2 3.6-2.4 8.4-3.4 13-3.2V5.8c-4.6-.2-9.4.8-13 3.2Z"
